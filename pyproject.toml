[project]
name = "tzarchiver"
version = "2.1"
description = "Extract and create Trainz .tzarc archives (v1 and v2), and extract .ja Jet Archives"
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
gui = ["PyQt6>=6.5"]
test = ["pytest>=7"]
build = ["pyinstaller>=6", "pillow>=10"]  # pillow: PyInstaller converts .ico -> .icns on macOS

[project.scripts]
tzarchiver = "tzarchiver.cli:main"
tzarchiver-gui = "tzarchiver.gui:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
