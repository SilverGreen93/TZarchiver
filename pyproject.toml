[project]
name = "tzarchiver"
version = "1.3.0"
description = "Extract and create Trainz .tzarc archives (v1 and v2)"
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
gui = ["PyQt6>=6.5"]
test = ["pytest>=7"]

[project.scripts]
tzarchiver = "tzarchiver.cli:main"
tzarchiver-gui = "tzarchiver.gui:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
